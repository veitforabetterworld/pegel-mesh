; PlatformIO-Umgebungen für den GPS-Tracker (XIAO nRF54LM20A Sense + Wio-SX1262 + L76K-GNSS).
; Wird von tools/pio.py als MeshCore-nrf54/platformio.local.ini eingehängt.
; Pfade in build_src_filter sind relativ zu MeshCore-nrf54/src, -I-Pfade relativ zu MeshCore-nrf54/.
;
; Erstes Flashen eines neuen Boards (ab Werk gesperrt): siehe README, Abschnitt Tracker.

[tracker]
extends = Xiao_nrf54lm20a
build_flags = ${Xiao_nrf54lm20a.build_flags}
  -I ../firmware/common
  -I ../firmware/tracker
  -I ../secrets
; target.cpp der Variante durch firmware/tracker/tracker_target.cpp ersetzt (Funk-SPI auf SPIM22, siehe dort)
build_src_filter = ${Xiao_nrf54lm20a.build_src_filter}
  -<../variants/xiao_nrf54lm20a/target.cpp>
  +<../../firmware/tracker>

[env:tracker_t1]
extends = tracker
build_flags = ${tracker.build_flags}
  -D TRACKER_SECRETS='"secrets_tracker_t1.h"'
; Für die Fehlersuche: -D TRACKER_DIAG (Reset-Grund, Sensorregister beim Start; ca. 1,5 s längere Wachzeit)
