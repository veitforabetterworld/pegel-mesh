; PlatformIO-Umgebungen für pegel-mesh.
; Wird von tools/pio.py als MeshCore/platformio.local.ini eingehängt, damit die
; MeshCore-Basiskonfiguration (Board-Varianten, EU-Funkparameter) unverändert genutzt wird.
; Pfade in build_src_filter sind relativ zu MeshCore/src, -I-Pfade relativ zu MeshCore/.

; PEGEL_BOARD=1: Trägerplatine hardware/pegel-sender (RS485 über SP3485 an Serial1 mit automatischer Richtung,
; Sondenversorgung an D0, Akkuspannung über VDD). PEGEL_BOARD=0: fliegender Aufbau mit RS485-Modul an Serial1.
[pegel_sender]
extends = Xiao_nrf52
build_flags = ${Xiao_nrf52.build_flags}
  -I ../firmware/common
  -I ../secrets
  -D PEGEL_BOARD=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../../firmware/sender>

[env:pegel_sender_a]
extends = pegel_sender
build_flags = ${pegel_sender.build_flags}
  -D PEGEL_SECRETS='"secrets_sender_a.h"'
  -D PEGEL_INTERVAL_S=60

[env:pegel_sender_b]
extends = pegel_sender
build_flags = ${pegel_sender.build_flags}
  -D PEGEL_SECRETS='"secrets_sender_b.h"'
  -D PEGEL_INTERVAL_S=300

[env:pegel_receiver]
extends = Xiao_S3_WIO
build_flags = ${Xiao_S3_WIO.build_flags}
  -I ../firmware/common
  -I ../secrets
build_src_filter = ${Xiao_S3_WIO.build_src_filter}
  +<../../firmware/receiver>
