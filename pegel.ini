; PlatformIO-Umgebungen für pegel-mesh.
; Wird von tools/pio.py als MeshCore/platformio.local.ini eingehängt, damit die
; MeshCore-Basiskonfiguration (Board-Varianten, EU-Funkparameter) unverändert genutzt wird.
; Pfade in build_src_filter sind relativ zu MeshCore/src, -I-Pfade relativ zu MeshCore/.

; PEGEL_BOARD=1: Trägerplatine hardware/pegel-sender-12v oder -5v (RS485 über SP3485 an Serial1 mit automatischer Richtung,
; Sondenversorgung an D0, Akkuspannung über VDD). PEGEL_BOARD=0: fliegender Aufbau mit RS485-Modul an Serial1.
[pegel_sender]
extends = Xiao_nrf52
build_flags = ${Xiao_nrf52.build_flags}
  -I ../firmware/common
  -I ../secrets
  -D PEGEL_BOARD=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../../firmware/sender>

; 5-V-Trägerplatine: Chip-Temp schaltet Heizung gegen Laden über P0.09 (NFC1, Draht an TP1).
; Unter 5 °C heizen, ab 8 °C laden. Li-Ion nur am XIAO-BAT.
[pegel_sender_5v]
extends = pegel_sender
build_flags = ${pegel_sender.build_flags}
  -D PEGEL_5V_BOARD=1

[env:pegel_sender_5v_a]
extends = pegel_sender_5v
build_flags = ${pegel_sender_5v.build_flags}
  -D PEGEL_SECRETS='"secrets_sender_a.h"'
  -D PEGEL_INTERVAL_S=60

[env:pegel_sender_a]
extends = pegel_sender
build_flags = ${pegel_sender.build_flags}
  -D PEGEL_SECRETS='"secrets_sender_a.h"'
  -D PEGEL_INTERVAL_S=60

[env:pegel_sender_b]
extends = pegel_sender
build_flags = ${pegel_sender.build_flags}
  -D PEGEL_SECRETS='"secrets_sender_b.h"'
  -D PEGEL_INTERVAL_S=300

[env:pegel_receiver]
extends = Xiao_S3_WIO
build_flags = ${Xiao_S3_WIO.build_flags}
  -I ../firmware/common
  -I ../secrets
build_src_filter = ${Xiao_S3_WIO.build_src_filter}
  +<../../firmware/receiver>

; Stromtest der Pegelsonde: Sonde dauerhaft an, Abfragen ohne Pause, kein Funk (firmware/sensortest).
[env:pegel_sensor_test]
extends = Xiao_nrf52
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../../firmware/sensortest>

; Test-Builds mit Serial-Befehlen, die die Notfallwege auslösen (Watchdog, Funk-Neustart, Heap, Zählerneustart).
[env:pegel_sender_a_test]
extends = env:pegel_sender_a
build_flags = ${env:pegel_sender_a.build_flags}
  -D PEGEL_TEST_CMDS=1

[env:pegel_receiver_test]
extends = env:pegel_receiver
build_flags = ${env:pegel_receiver.build_flags}
  -D PEGEL_TEST_CMDS=1
  -D RESYNC_BLOCKS=3
  -D RESYNC_MIN_MS=120000
